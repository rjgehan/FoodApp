name: Build frontend image

# Builds the web app and pushes it to GHCR. Deployment is a pull on the server
# (see DEPLOY.md) — nothing here touches the running app.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/foodapp-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Vite inlines the API URL at build time, so it has to be known here rather than in
      # the container's environment. Leave the VITE_API_URL repo variable unset and the app
      # falls back to <the host that served the page>:8080, which is what docker-compose
      # publishes — set it only if the API lives somewhere else (a domain, a reverse proxy).
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: web
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Pushed \`${{ env.IMAGE }}:latest\` and \`:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "VITE_API_URL: \`${{ vars.VITE_API_URL || '(unset — falls back to <host>:8080)' }}\`" >> $GITHUB_STEP_SUMMARY
