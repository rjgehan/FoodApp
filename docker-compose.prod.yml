# Production stack. Images come from GHCR (built by GitHub Actions on push to main);
# nothing is built on the server. See DEPLOY.md.
name: mealplanner

services:
  postgres:
    networks: [mealplanner]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mealplanner}
      POSTGRES_USER: ${DB_USER:-mealplanner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The backend waits on this, so it never starts against a database that isn't listening.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mealplanner} -d ${DB_NAME:-mealplanner}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    networks: [mealplanner]
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    networks: [mealplanner]
    image: ghcr.io/${GHCR_OWNER:-rjgehan}/foodapp-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-mealplanner}
      DB_USER: ${DB_USER:-mealplanner}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    # No published port. The frontend's nginx proxies /api and /ws to this container over the
    # compose network, so the app needs exactly one port on the host.

  frontend:
    networks: [mealplanner]
    image: ghcr.io/${GHCR_OWNER:-rjgehan}/foodapp-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  # Named volume: `docker compose down` leaves it alone. Only `down -v` destroys the data.
  postgres-data:

# Declared explicitly, not left to compose's implicit default. Some hosts (CasaOS's YAML
# import among them) run the containers on Docker's DEFAULT bridge, which has no embedded
# DNS at all — so `postgres` and `backend` resolve to nothing and every service fails to
# find every other one. A named network guarantees name resolution wherever this runs.
networks:
  mealplanner:
    name: mealplanner
