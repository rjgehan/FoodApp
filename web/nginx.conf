# React Router is client-side, and the API is reached through this same server on /api —
# so the browser only ever talks to one origin and one port. No CORS, and no API URL baked
# into the bundle at build time.

# WebSocket upgrades need this mapping; conf.d files are included inside `http`, so a `map`
# at the top of the file is in the right place.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Resolved once at startup from the container's own resolv.conf. Pinning Docker's
        # embedded resolver at 127.0.0.11 is not portable — it is refused outright on some
        # hosts, which takes the whole proxy down. depends_on guarantees the name exists.
        proxy_pass http://backend:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Recipe photos are downscaled to ~200KB in the browser, but nginx's 1MB default
        # would still reject the larger ones. The backend caps uploads at 3MB.
        client_max_body_size 8m;
    }

    location /ws/ {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;

        # SockJS falls back to long-polling when a socket isn't available; buffering would
        # stall those streams.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
