spring:
  application:
    name: mealplanner
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mealplanner}
    username: ${DB_USER:mealplanner}
    password: ${DB_PASSWORD:mealplanner}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      # The browser downscales before uploading; these are a backstop, not a target.
      max-file-size: 4MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    # 30 days, and the app swaps it for a fresh one each day it is opened — so you are only ever
    # signed out after a month of not using it, not a day after signing in.
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:43200}
  ai:
    # Sorting the grocery list into aisles. Unset means the feature is hidden entirely.
    api-key: ${GEMINI_API_KEY:}
    model: ${RECIPE_AI_MODEL:gemini-3.6-flash}
    max-tokens: ${RECIPE_AI_MAX_TOKENS:2000}
    base-url: ${RECIPE_AI_BASE_URL:}
  integration:
    # Read-only API for a home dashboard. Unset means off; the endpoints answer 503.
    api-key: ${INTEGRATION_API_KEY:}
  # What each import was given, kept so the caption parsers can be re-run over real ones
  # later. On here, because this is the machine the parsing gets worked on. Off in
  # production: it would otherwise accumulate other people's captions verbatim on a server
  # that is reachable from the internet, which is a different thing entirely from reading
  # one recipe somebody asked for.
  import-log: ${MEALPLANNER_IMPORT_LOG:}
  auth:
    # Small trusted app: a username plus a 4-digit PIN, throttled instead of made complex.
    max-pin-attempts: ${AUTH_MAX_PIN_ATTEMPTS:5}
    lockout-minutes: ${AUTH_LOCKOUT_MINUTES:15}
