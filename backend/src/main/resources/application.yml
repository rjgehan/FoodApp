spring:
  application:
    name: mealplanner
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mealplanner}
    username: ${DB_USER:mealplanner}
    password: ${DB_PASSWORD:mealplanner}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      # The browser downscales before uploading; these are a backstop, not a target.
      max-file-size: 4MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  ai:
    # Writing a recipe from a name. Unset means the feature is hidden entirely.
    api-key: ${GEMINI_API_KEY:}
    model: ${RECIPE_AI_MODEL:gemini-2.5-flash}
    max-tokens: ${RECIPE_AI_MAX_TOKENS:2000}
    base-url: ${RECIPE_AI_BASE_URL:}
  integration:
    # Read-only API for a home dashboard. Unset means off; the endpoints answer 503.
    api-key: ${INTEGRATION_API_KEY:}
  auth:
    # Small trusted app: a username plus a 4-digit PIN, throttled instead of made complex.
    max-pin-attempts: ${AUTH_MAX_PIN_ATTEMPTS:5}
    lockout-minutes: ${AUTH_LOCKOUT_MINUTES:15}
