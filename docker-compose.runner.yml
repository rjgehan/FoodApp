# Self-hosted GitHub Actions runner for this repo — lives on the home server next to your other
# Docker-based services. Builds images via the host's Docker daemon (docker.sock) and deploys to
# k3s via a mounted kubeconfig, so nothing needs to be exposed to the internet.
#
# One-time setup:
#   1. Create a PAT with `repo` scope (classic) or fine-grained "Administration: read/write" on this
#      repo, used only to register the runner (myoung34/github-runner exchanges it for a runner token).
#   2. Copy .env.runner.example to .env.runner and fill in ACCESS_TOKEN.
#   3. Copy your k3s kubeconfig to ./runner-kubeconfig on this host (chmod 600).
#   4. docker compose -f docker-compose.runner.yml --env-file .env.runner up -d
services:
  runner:
    image: myoung34/github-runner:latest
    restart: unless-stopped
    env_file:
      - .env.runner
    environment:
      RUNNER_SCOPE: repo
      REPO_URL: https://github.com/rjgehan/FoodApp
      RUNNER_NAME: mealplanner-runner
      LABELS: self-hosted,mealplanner
      RUNNER_WORKDIR: /tmp/runner/work
      KUBECONFIG: /kubeconfig/config
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runner-kubeconfig:/kubeconfig/config:ro
      - runner-work:/tmp/runner/work

volumes:
  runner-work:
